<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Akuna Capital</title>
    <meta name="description" content="Akuna Capital institutional digital assets, quantitative trading strategies, peer-to-peer escrows, and automated trading portfolios." />
    <meta property="og:title" content="Akuna Capital" />
    <meta property="og:description" content="Akuna Capital institutional digital assets, quantitative trading strategies, peer-to-peer escrows, and automated trading portfolios." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="preconnect" href="https://images.unsplash.com" crossorigin />
    <link rel="dns-prefetch" href="https://images.unsplash.com" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <meta name="theme-color" content="#091420" />
    <meta name="application-name" content="Akuna Capital" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Akuna Capital" />
    <meta name="mobile-web-app-capable" content="yes" />
  </head>
  <body class="bg-[#091420] overflow-x-hidden selection:bg-emerald-500/20 selection:text-emerald-400">
    <div id="root">
      <!-- Premium instant CSS splash loading screen -->
      <div id="splash-screen-pre" style="
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: #091420;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1.5rem;
        font-family: -apple-system, BlinkMacSystemFont, 'IBM Plex Sans', 'Plus Jakarta Sans', Roboto, Helvetica, Arial, sans-serif;
        color: #ffffff;
        z-index: 9999;
      ">
        <style>
          @keyframes logoScalePulse {
            0%, 100% {
              transform: scale(1) translateY(0);
              box-shadow: 0 15px 30px -10px rgba(16, 185, 129, 0.25);
            }
            50% {
              transform: scale(1.05) translateY(-4px);
              box-shadow: 0 25px 45px -12px rgba(16, 185, 129, 0.45);
            }
          }
          @keyframes spinnerRotation {
            to { transform: rotate(360deg); }
          }
          @keyframes textFadeBlink {
            0%, 100% { opacity: 0.45; }
            50% { opacity: 1; }
          }
          .splash-box {
            position: relative;
            width: 76px;
            height: 76px;
            border-radius: 22px;
            background-color: #0f1f2e;
            border: 1px solid rgba(16, 185, 129, 0.35);
            padding: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            animation: logoScalePulse 2s ease-in-out infinite;
          }
          .splash-logo {
            width: 100%;
            height: 100%;
            object-fit: contain;
          }
          .splash-spinner {
            width: 24px;
            height: 24px;
            border: 3px solid rgba(16, 185, 129, 0.2);
            border-top: 3px solid #10b981;
            border-radius: 50%;
            animation: spinnerRotation 0.8s linear infinite;
          }
          .splash-text {
            font-size: 11px;
            font-weight: 700;
            color: #94a3b8;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            animation: textFadeBlink 1.5s ease-in-out infinite;
            margin-top: 4px;
          }
          .splash-glow {
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(16, 185, 129, 0.15) 0%, transparent 60%);
            pointer-events: none;
          }
        </style>
        <div class="splash-box">
          <img class="splash-logo" src="/icon.svg" alt="Akuna Capital" />
          <div class="splash-glow"></div>
        </div>
        <div style="display: flex; flex-direction: column; align-items: center; gap: 8px;">
          <div class="splash-spinner"></div>
          <span class="splash-text">Akuna Capital</span>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
